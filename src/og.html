<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Michael Santa Cruz</title>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-weight: 500 800;
        src: url("../public/fonts/bricolage-grotesque-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Outfit";
        font-style: normal;
        font-weight: 500;
        src: url("../public/fonts/outfit-latin.woff2") format("woff2");
      }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 72px 76px;
        box-sizing: border-box;
        background:
          radial-gradient(700px 420px at 92% 18%, rgba(255, 76, 41, 0.28), transparent 60%),
          #09090b;
        color: #f6f3ee;
        font-family: Outfit, sans-serif;
      }
      h1 {
        margin: 0;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        font-size: 108px;
        line-height: 0.84;
        letter-spacing: -0.055em;
      }
      .last { display: block; color: #ff4c29; }
      p {
        margin: 28px 0 0;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .rule { width: 84px; height: 6px; background: #ff4c29; margin-top: 28px; border-radius: 99px; }
      .mark {
        width: 340px;
        height: 340px;
        flex: 0 0 auto;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, #ff4c29 0 5%, transparent 5.8%),
          radial-gradient(circle at 50% 50%, transparent 0 28%, rgba(255, 76, 41, 0.95) 28.5% 29.7%, transparent 30.2%),
          radial-gradient(circle at 50% 50%, transparent 0 47%, rgba(246, 243, 238, 0.62) 47.5% 48.3%, transparent 48.8%),
          radial-gradient(circle at 50% 50%, transparent 0 65%, rgba(255, 76, 41, 0.8) 65.5% 66.6%, transparent 67.2%),
          radial-gradient(circle at 50% 50%, transparent 0 81%, rgba(246, 243, 238, 0.28) 81.4% 82.2%, transparent 82.8%);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Michael<span class="last">Santa Cruz</span></h1>
      <div class="rule"></div>
      <p>Drummer · Musician · Producer · Teacher</p>
    </div>
    <div class="mark"></div>
  </body>
</html>
