<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Michael Santa Cruz</title>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 500 700;
        src: url("../public/fonts/fraunces-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nunito Sans";
        font-style: normal;
        font-weight: 500 700;
        src: url("../public/fonts/nunito-sans-latin.woff2") format("woff2");
      }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        background:
          radial-gradient(520px 360px at 0% 100%, rgba(62, 107, 74, 0.55), transparent 60%),
          #1a120c;
        color: #f6efe2;
        font-family: "Nunito Sans", sans-serif;
      }
      .copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 56px 40px 56px 64px;
      }
      h1 {
        margin: 0;
        font-family: Fraunces, serif;
        font-weight: 700;
        font-size: 84px;
        line-height: 0.88;
        letter-spacing: -0.03em;
      }
      .last { display: block; color: #e2a322; }
      .rule {
        width: 76px;
        height: 6px;
        margin-top: 22px;
        border-radius: 99px;
        background: linear-gradient(90deg, #8fb56a, #e2a322 55%, #c4542a);
      }
      p { margin: 22px 0 0; font-size: 24px; font-weight: 600; }
      .tours {
        margin-top: 18px;
        font-family: Fraunces, serif;
        font-weight: 700;
        font-size: 28px;
        color: #e2a322;
      }
      .photo {
        position: relative;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 68% 36%;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>Michael<span class="last">Santa Cruz</span></h1>
      <div class="rule"></div>
      <p>Drummer · Musician · Producer · Teacher</p>
      <p class="tours">Available for tours: NYC / LA</p>
    </div>
    <div class="photo">
      <img src="../public/images/michael-drumming-1200.jpg" alt="">
    </div>
  </body>
</html>
